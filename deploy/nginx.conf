# Montado por docker-compose en /etc/nginx/conf.d/default.conf (ver web/Dockerfile y
# deploy/docker-compose.yml). Sirve el build de web/ y hace proxy de /api a la API.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA: cualquier ruta sin archivo cae en index.html (react-router del lado del cliente).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Eventos de trabajos por SSE: sin buffering, conexión larga (ver
    # docs/arch/001-predicts.md#trabajos-y-eventos). Location más específica que /api/
    # así nginx la prioriza para este prefijo.
    location /api/trabajos/ {
        proxy_pass http://api:8000/trabajos/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
