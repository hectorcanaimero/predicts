name: ci

on:
  pull_request:
  push:
    branches: [master]

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: predicts
          POSTGRES_PASSWORD: predicts
          POSTGRES_DB: predicts_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://predicts:predicts@localhost:5432/predicts_test
    steps:
      - uses: actions/checkout@v4
      - name: Check api/ exists
        id: check
        run: echo "exists=$([ -d api ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@v3
        if: steps.check.outputs.exists == 'true'
        with:
          python-version: "3.13"
      - name: uv sync
        if: steps.check.outputs.exists == 'true'
        working-directory: api
        run: uv sync --frozen
      - name: ruff check
        if: steps.check.outputs.exists == 'true'
        working-directory: api
        run: uv run ruff check .
      - name: pytest
        if: steps.check.outputs.exists == 'true'
        working-directory: api
        run: uv run pytest -q

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check web/ exists
        id: check
        run: echo "exists=$([ -d web ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        if: steps.check.outputs.exists == 'true'
        with:
          node-version: "22"
      - name: npm ci
        if: steps.check.outputs.exists == 'true'
        working-directory: web
        run: npm ci
      - name: npm run lint
        if: steps.check.outputs.exists == 'true'
        working-directory: web
        run: npm run lint
      - name: npm test
        if: steps.check.outputs.exists == 'true'
        working-directory: web
        run: npm test -- --run
      - name: npm run build
        if: steps.check.outputs.exists == 'true'
        working-directory: web
        run: npm run build

  test:
    runs-on: ubuntu-latest
    needs: [api, web]
    if: always()
    steps:
      - name: require api and web to pass
        run: |
          if [ "${{ needs.api.result }}" != "success" ] || [ "${{ needs.web.result }}" != "success" ]; then
            echo "api=${{ needs.api.result }} web=${{ needs.web.result }}"
            exit 1
          fi
